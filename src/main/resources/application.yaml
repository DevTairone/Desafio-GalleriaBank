spring:
  application:
    name: compras

  config:
    import: optional:file:.env.yaml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/galleriabank_compras}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    user:
      name: ${ADMIN_USUARIO}
      password: ${ADMIN_SENHA}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

server:
  port: 8080
  error:
    include-message: always